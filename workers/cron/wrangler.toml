# Scheduled Worker: rollup, purge, health. Deployed by the owner on the free plan.
# Same database as the Pages project, so both hit one local DB in tests.
name = "saikanagat-cron"
main = "index.js"
workers_dev = false
preview_urls = false
compatibility_date = "2025-09-01"

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sk-events"
database_id = "ffa0e060-cee7-4d8b-916d-62ebc6a23963"
migrations_dir = "../../migrations"
