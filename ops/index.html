<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Site analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ops/ops.css">
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<div class="shell">
  <header class="top">
    <p class="brand">Site analytics</p>
    <details class="menu" id="menu">
      <summary id="menu-summary">Views</summary>
      <nav aria-label="Views" id="nav"></nav>
    </details>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p class="note">This dashboard needs JavaScript. It loads nothing from other sites.</p></noscript>
    <div id="controls" class="controls"></div>
    <div id="view" aria-live="polite" aria-busy="true"></div>
  </main>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>
</div>
<script src="/ops/vendor/qrcode.js"></script>
<script type="module" src="/ops/app.js"></script>
</body>
</html>
