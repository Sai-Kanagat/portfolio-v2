# Cloudflare Pages project (static site in dist/, Functions in functions/).
# The remote D1 database sk-events exists. Nothing in this repo has been applied
# to it: migrations and deploys are run by the owner, never by tests.
name = "saikanagat"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[vars]
# Production host of the Pages project. Only this exact host is 301ed to the
# canonical origin. Hash-prefixed previews and branch aliases never are.
PRODUCTION_PAGES_HOST = "saikanagat-7yg.pages.dev"
CANONICAL_ORIGIN = "https://saikanagat.com"
# This repo is public, so these three are NOT in [vars]. Set them as Pages secrets
# (wrangler pages secret put NAME --project-name saikanagat-7yg, or the dashboard):
#   CF_ACCESS_TEAM_DOMAIN  e.g. yourteam.cloudflareaccess.com
#   CF_ACCESS_AUD          Access application audience tag
#   OPS_ALLOWED_EMAILS     comma separated allow list
# While any is unset, /ops and /api/ops deny every request (fail closed).

[[d1_databases]]
binding = "DB"
database_name = "sk-events"
database_id = "ffa0e060-cee7-4d8b-916d-62ebc6a23963"
migrations_dir = "migrations"

# Preview deployments use their own database, never the production one.
[env.preview.vars]
PRODUCTION_PAGES_HOST = "saikanagat-7yg.pages.dev"
CANONICAL_ORIGIN = "https://saikanagat.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "sk-events-preview"
database_id = "6f41b64d-f927-4f85-a77a-937066f785e5"
migrations_dir = "migrations"
