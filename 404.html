  <style>

    @media (prefers-color-scheme:dark){:root{--ink:oklch(0.975 0.004 260);--paper:oklch(0.16 0.012 260);--accent:oklch(0.55 0.22 262);--rule:oklch(0.30 0.01 260);--body:oklch(0.86 0.008 260)}}
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
    main{max-width:1240px;margin:0 auto;padding:96px 24px 96px;display:grid;grid-template-columns:3fr 2fr;gap:48px;align-items:start}
    h1{font-size:clamp(36px,6vw,88px);line-height:1.02;font-weight:600;letter-spacing:-0.02em;margin:0 0 24px}
    p{color:var(--body);max-width:52ch;margin:0 0 16px}
    code{font-family:var(--mono);font-size:14px;color:var(--ink);overflow-wrap:anywhere}
    .path{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin:32px 0}
    .home{display:inline-block;background:var(--ink);color:var(--paper);padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:500}
    .home:hover{background:var(--accent);color:#fff}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
    li a{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:22px;font-weight:500}
    li a span{font-family:var(--mono);font-size:14px;color:var(--body);font-weight:400}
    li a:hover{color:var(--accent)}
    h2{font-size:14px;font-weight:500;margin:0 0 16px;color:var(--body)}
    @media (max-width:760px){main{grid-template-columns:1fr;padding:48px 16px 64px;gap:48px}}
